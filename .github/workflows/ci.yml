name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a WinCE pre-release after all required checks
        type: boolean
        default: false
      pull_request:
        description: Exact PR to merge after the checks (leave empty for an already merged revision)
        type: string
        default: ''

permissions:
  contents: read

# Keep publication separate from PR checks: a delayed synchronize event must not
# cancel a manual release. Newer runs of the same event still retire old builds.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  CARGO_BUILD_JOBS: "2"
  # Keep Cargo artifacts separate from extracted FFmpeg sources.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
  # Keep older native dependencies compatible with recent CMake releases.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  android-backup-tools:
    name: Android ADB backup tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Windows, Linux and Python rescue scripts
        run: bash tools/package-android-adb-backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-Android-ADB-Backup
          path: dist/android-backup/PocketHLE-Android-ADB-Backup.zip
          if-no-files-found: error

  hardware-diag:
    name: HARDWARE DIAG (download)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install small ARM diagnostic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3
      - name: Build the single ARM diagnostic and verify its archive
        run: python3 tools/hardware-diag/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: HARDWARE-DIAG
          path: tools/hardware-diag/dist/HARDWARE-DIAG.zip
          if-no-files-found: error
          retention-days: 30

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    needs: [fmt]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxss-dev \
            libasound2-dev \
            cmake build-essential libclang-dev clang lld python3
      - name: build static FFmpeg
        run: bash tools/build-ffmpeg.sh x86_64-unknown-linux-gnu 4
      - name: advisory clippy analysis
        env:
          # This job already uses continue-on-error; retain diagnostics as warnings.
          RUSTFLAGS: ""
        run: cargo clippy --workspace --all-targets --locked -- -A unknown-lints

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxss-dev \
            libasound2-dev \
            cmake build-essential libclang-dev clang lld python3
      - name: build static FFmpeg
        run: bash tools/build-ffmpeg.sh x86_64-unknown-linux-gnu 4
      - run: cargo build --workspace --release --locked --features pocket-winceapi/unicorn-tests
      - name: run workspace tests sequentially
        # Includes launcher navigation and synthetic ARM/Thumb callback ABI
        # regressions. HARDWARE DIAG fixtures remain a separate opt-in feature.
        run: cargo test --workspace --release --locked --features pocket-winceapi/unicorn-tests --no-fail-fast -- --test-threads=1

  build-unicorn:
    name: build with unicorn-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - name: install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config libclang-dev \
            libasound2-dev
      - name: build pocket-cli with unicorn feature
        run: cargo build --release --locked -p pocket-cli --features unicorn

  build-linux:
    name: build linux release artifacts
    runs-on: ubuntu-24.04
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxss-dev \
            libasound2-dev \
            cmake build-essential libclang-dev clang lld python3
      - name: build static FFmpeg
        run: bash tools/build-ffmpeg.sh x86_64-unknown-linux-gnu 4
      - name: build CLI + desktop (with unicorn-engine)
        run: |
          cargo build --release --locked -p pocket-cli --features unicorn
          cargo build --release --locked -p pocket-desktop
      - name: stage artifacts
        run: |
          mkdir -p dist/PocketHLE-linux
          cp -R frontends/pocket-desktop/licenses dist/PocketHLE-linux/
          cp LICENSE LICENSE-APACHE LICENSE-MIT dist/PocketHLE-linux/
          cp target/cargo/release/pockethle dist/PocketHLE-linux/
          cp target/cargo/release/pockethle-gui dist/PocketHLE-linux/
          cp tools/install-desktop-entry.sh dist/PocketHLE-linux/
          cp frontends/pocket-desktop/assets/pockethle-256.png dist/PocketHLE-linux/pockethle.png
          cp README.md dist/PocketHLE-linux/
          cp -f README.ru.md dist/PocketHLE-linux/ 2>/dev/null || true
          tar -C dist -czf PocketHLE-linux-x86_64.tar.gz PocketHLE-linux
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-linux-x86_64
          path: PocketHLE-linux-x86_64.tar.gz

  build-windows:
    name: build windows release artifacts
    runs-on: windows-latest
    needs: [fmt]
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          install: make diffutils pkgconf
          path-type: inherit
      - name: build static FFmpeg with MSVC
        shell: pwsh
        env:
          POCKETHLE_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/build-ffmpeg.ps1 -MsysRoot $env:POCKETHLE_MSYS_ROOT -Jobs 4
      - name: build CLI + desktop
        shell: pwsh
        run: |
          cargo build --release --locked -p pocket-cli --features unicorn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p pocket-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: test native H264 and AAC recording at 30 and 60 FPS
        shell: pwsh
        run: |
          cargo test --release --locked -p pocket-desktop --bin pockethle-gui compressed_recording_writes_mp4_through_native_ffmpeg -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: stage artifacts
        shell: bash
        run: |
          mkdir -p dist/PocketHLE-windows
          cp -R frontends/pocket-desktop/licenses dist/PocketHLE-windows/
          cp LICENSE LICENSE-APACHE LICENSE-MIT dist/PocketHLE-windows/
          cp target/cargo/release/pockethle.exe dist/PocketHLE-windows/
          cp target/cargo/release/pockethle-gui.exe dist/PocketHLE-windows/
          cp README.md dist/PocketHLE-windows/
          cp docs/STEAMDECK.md dist/PocketHLE-windows/README-SteamDeck.md
          cp docs/WINDOWS-CE.md dist/PocketHLE-windows/README-Windows-CE.md
          mkdir -p dist/PocketHLE-windows/profiles
          cp profiles/wince6-portable.json dist/PocketHLE-windows/profiles/
          cp profiles/wince6-native.json profiles/wince6-native-cerf.json dist/PocketHLE-windows/profiles/
          cp -f README.ru.md dist/PocketHLE-windows/ 2>/dev/null || true
      - name: zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PocketHLE-windows/* -DestinationPath PocketHLE-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-windows-x86_64
          path: PocketHLE-windows-x86_64.zip
  build-android:
    name: build android APK
    runs-on: ubuntu-24.04
    needs: [fmt]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not let Rust cache cleanup traverse FFmpeg test symlinks.
          workspaces: ". -> target/cargo"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: install matching Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libclang-dev curl unzip python3
      - name: install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: cross-compile native libraries with Unicorn and static FFmpeg
        run: bash tools/build-android-native.sh 4
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - name: prepare stable Android signing
        shell: bash
        env:
          POCKETHLE_KEYSTORE_BASE64: ${{ secrets.POCKETHLE_KEYSTORE_BASE64 }}
          POCKETHLE_KEYSTORE_PASSWORD: ${{ secrets.POCKETHLE_KEYSTORE_PASSWORD }}
          POCKETHLE_KEY_ALIAS: ${{ secrets.POCKETHLE_KEY_ALIAS }}
          POCKETHLE_KEY_PASSWORD: ${{ secrets.POCKETHLE_KEY_PASSWORD }}
        run: bash tools/prepare-android-signing.sh
      - name: build and verify APK
        run: bash tools/build-android-apk.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          POCKETHLE_KEYSTORE_PASSWORD: ${{ secrets.POCKETHLE_KEYSTORE_PASSWORD }}
          POCKETHLE_KEY_ALIAS: ${{ secrets.POCKETHLE_KEY_ALIAS }}
          POCKETHLE_KEY_PASSWORD: ${{ secrets.POCKETHLE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-android
          path: dist/android/PocketHLE-*.apk
          if-no-files-found: error

  wince-source-and-profile:
    name: WinCE profile and corresponding source
    runs-on: ubuntu-24.04
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Package profile templates and complete locked source
        run: |
          mkdir -p target dist/release
          cargo vendor --locked vendor-cargo > target/vendor-config.toml
          python3 tools/package-wince-profile.py --output dist/release/PocketHLE-GDI-WinCE-profile.zip
          python3 tools/package-wince-source.py --output dist/release/PocketHLE-GDI-source-kit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-GDI-profile-and-source
          path: dist/release/*.zip
          if-no-files-found: error

  wince-prerelease:
    name: Merge reviewed revision and publish WinCE pre-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, test, build-unicorn, build-linux, build-windows, build-android, wince-source-and-profile]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PocketHLE-*
          path: dist/downloaded
          merge-multiple: true
      - name: Merge the exact tested PR and publish installable packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re,pathlib; print(re.search(r"^version\s*=\s*\"([^\"]+)\"",pathlib.Path("Cargo.toml").read_text(),re.M)[1])')
          tag="v$version"
          target="$GITHUB_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo 'Invalid PR number'; exit 1; }
            head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            [[ "$head" == "$GITHUB_SHA" ]] || { echo 'PR changed after the build; refusing to merge another revision'; exit 1; }
            state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            if [[ "$state" != MERGED ]]; then
              gh pr merge "$PR_NUMBER" --merge --match-head-commit "$GITHUB_SHA"
            fi
            target=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)
            [[ -n "$target" && "$target" != null ]]
          fi
          python3 - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('dist/downloaded')
          assets=sorted(p for p in root.iterdir() if p.is_file() and (p.suffix=='.apk' or p.name.endswith(('.zip','.tar.gz'))))
          if not any(p.suffix=='.apk' and 'unsigned' not in p.name for p in assets):
              raise SystemExit('No signed Android APK; refusing publication')
          if any('unsigned' in p.name for p in assets):
              raise SystemExit('Unsigned APK is not a public installable package')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PY
          mapfile -t assets < <(find dist/downloaded -maxdepth 1 -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.tar.gz' -o -name SHA256SUMS.txt \) | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease --notes-file "docs/releases/$tag.md"
          else
            gh release create "$tag" "${assets[@]}" --target "$target" --prerelease --title "PocketHLE-GDI $version (WinCE pre-release)" --notes-file "docs/releases/$tag.md"
          fi
